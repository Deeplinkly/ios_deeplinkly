name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check release version consistency
        run: ruby tool/check_version.rb

      - name: Validate package manifest
        run: swift package dump-package > /dev/null

      - name: Run SDK tests
        run: |
          set -o pipefail
          SIMULATOR_ID="$(
            xcrun simctl list devices available -j |
              ruby -rjson -e '
                devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
                phone = devices.find { |device| device["isAvailable"] && device["name"].start_with?("iPhone") }
                abort "No available iPhone simulator" unless phone
                puts phone.fetch("udid")
              '
          )"
          xcodebuild test \
            -scheme Deeplinkly \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"

      - name: Validate CocoaPods package
        run: pod lib lint Deeplinkly.podspec --skip-tests
