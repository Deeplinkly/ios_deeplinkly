name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 45
    environment: release
    env:
      COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and package versions
        run: ruby tool/check_version.rb "${GITHUB_REF_NAME}"

      - name: Validate package manifest
        run: swift package dump-package > /dev/null

      - name: Run SDK tests
        run: |
          set -o pipefail
          SIMULATOR_ID="$(
            xcrun simctl list devices available -j |
              ruby -rjson -e '
                devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
                phone = devices.find { |device| device["isAvailable"] && device["name"].start_with?("iPhone") }
                abort "No available iPhone simulator" unless phone
                puts phone.fetch("udid")
              '
          )"
          xcodebuild test \
            -scheme Deeplinkly \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}"

      - name: Validate the tagged CocoaPod
        run: pod spec lint Deeplinkly.podspec --skip-tests

      - name: Publish to CocoaPods Trunk
        shell: bash
        run: |
          set -o pipefail

          published_to_trunk() {
            local response
            response="$(
              curl --fail --silent --show-error \
                "https://trunk.cocoapods.org/api/v1/pods/Deeplinkly"
            )" || return 1

            ruby -rjson -e '
              version = ARGV.fetch(0)
              versions = JSON.parse(STDIN.read).fetch("versions", [])
              exit(versions.any? { |item| item["name"] == version } ? 0 : 1)
            ' "${GITHUB_REF_NAME}" <<< "${response}"
          }

          if published_to_trunk; then
            echo "Deeplinkly ${GITHUB_REF_NAME} is already published to CocoaPods Trunk."
            exit 0
          fi

          if pod trunk push Deeplinkly.podspec --skip-tests; then
            exit 0
          fi

          echo "::warning::CocoaPods reported a publish failure; checking whether Trunk committed the version."
          for attempt in 1 2 3 4 5 6; do
            if published_to_trunk; then
              echo "Deeplinkly ${GITHUB_REF_NAME} is available on CocoaPods Trunk."
              exit 0
            fi

            if [[ "${attempt}" -lt 6 ]]; then
              sleep 10
            fi
          done

          echo "::error::Deeplinkly ${GITHUB_REF_NAME} was not found on CocoaPods Trunk after the push failed."
          exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
